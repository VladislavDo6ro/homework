<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Практика по формам</title>
    <link rel="stylesheet" href="./CSS/style.css" />
    <link rel="stylesheet" href="./CSS/normalize.css" />
  </head>
  <body>
    <form action="form">
      <legend>Ваши личные данные</legend>
      <fieldset class="group-1">
        <label>
          Ваше имя
          <input type="Name" required placeholder="Имя" />
        </label>
        <label>
          Ваш возраст
          <input type="number" required placeholder="Возраст" />
        </label>
        <label>
          Ваш номер телефона
          <input type="tel" required placeholder="Номер телефона" />
        </label>
        <label>
          Ваша почта
          <input type="email" required placeholder="Почта" />
        </label>
        <label>
          Сообщение
          <textarea
            name="coments"
            required
            placeholder="Ваше сообщение"
          ></textarea>
        </label>
      </fieldset>
      <label class="label checkbox-label">
        <input class="checkbox" type="checkbox" name="checkbox" required />
        <span class="checkbox-text">Я принимаю правила</span>
      </label>
      <button class="button">Отправить</button>
    </form>
  </body>
</html>
